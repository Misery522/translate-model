name: 问题报告
description: 提交可复现的运行或翻译问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: 请使用脱敏样例。不要提交令牌、真实词库、个人路径或完整环境报告；安全漏洞请先阅读 SECURITY.md。
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: 标签或 commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、Python/Ollama 版本、模型标签和启动方式，不要粘贴用户目录。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      description: 包含脱敏输入、目标语言、风格、领域和任务模式。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 必要错误信息
      description: 仅提供相关错误，先隐藏原文和个人信息。
      render: text
