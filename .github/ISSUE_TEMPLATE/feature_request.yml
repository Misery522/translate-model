name: 功能建议
description: 说明希望改善的使用场景
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: 请先查看 docs/ROADMAP.md 中的规划；建议不等于已安排交付。
  - type: textarea
    id: problem
    attributes:
      label: 希望解决的问题
      description: 谁会使用、当前哪里不方便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望行为
      description: 使用一个具体但不含敏感信息的例子说明。
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: 限制与替代方案
      description: 例如设备、离线要求、权限、隐私或已有替代方式。
