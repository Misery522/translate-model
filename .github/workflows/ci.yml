name: CI

on:
  push:
    branches: [main, "chore/**", "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADIO_ANALYTICS_ENABLED: "False"
  DO_NOT_TRACK: "1"
  PYTHONUTF8: "1"

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked --group dev --python ${{ matrix.python }}
      - name: Lint all Python sources
        run: uv run --no-sync ruff check .
      - name: Check dependency consistency
        run: uv pip check
      - name: Audit the committed publication snapshot
        run: uv run --no-sync python scripts/audit_publication.py --scope tracked
      - name: Unit tests (hard limit of 60 seconds)
        run: uv run --no-sync python -c "import subprocess, sys; sys.exit(subprocess.run([sys.executable, '-m', 'pytest', '-m', 'not ollama'], timeout=60).returncode)"

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: false
      - name: Install locked audit environment
        run: uv sync --locked --group audit --python 3.14
      - name: Audit installed dependency versions
        run: uv run --no-sync pip-audit --local --skip-editable --progress-spinner off

  package:
    name: Distribution (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: false
      - name: Install locked build and test dependencies
        run: uv sync --locked --group dev --python 3.14
      - name: Build wheel and source distribution
        run: uv build --out-dir dist
      - name: Verify wheel imports and isolated sdist tests (60 seconds per subprocess)
        run: uv run --no-sync python scripts/verify_distributions.py --dist-dir dist

  web:
    name: Private web client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.18.1"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: false
      - name: Install locked Python protocol dependencies
        run: uv sync --locked --python 3.14
      - name: Install locked frontend dependencies
        run: npm --prefix web ci
      - name: Check generated API contract
        run: |
          uv run --no-sync python scripts/export_openapi.py --check
          npm --prefix web run generate:api
          git diff --exit-code -- web/openapi.json web/src/api.generated.ts
      - name: Browser behavior unit tests (hard limit of 60 seconds)
        run: npm --prefix web test
      - name: Check frontend source formatting
        run: npm --prefix web run format:check
      - name: Typecheck and build static shell
        run: npm --prefix web run build
      - name: Audit frontend dependencies
        run: npm --prefix web audit --audit-level=moderate

  required:
    name: Required checks
    needs: [test, dependencies, package, web]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every test and audit job to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
          AUDIT_RESULT: ${{ needs.dependencies.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          WEB_RESULT: ${{ needs.web.result }}
        run: test "$TEST_RESULT" = success && test "$AUDIT_RESULT" = success && test "$PACKAGE_RESULT" = success && test "$WEB_RESULT" = success
