name: CI

on:
  push:
    branches: [main, "chore/**", "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADIO_ANALYTICS_ENABLED: "False"
  DO_NOT_TRACK: "1"
  PYTHONUTF8: "1"

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked --group dev --python ${{ matrix.python }}
      - name: Lint all Python sources
        run: uv run --no-sync ruff check .
      - name: Check dependency consistency
        run: uv pip check
      - name: Audit the committed publication snapshot
        run: uv run --no-sync python scripts/audit_publication.py --scope tracked
      - name: Unit tests (hard limit of 60 seconds)
        run: uv run --no-sync python -c "import subprocess, sys; sys.exit(subprocess.run([sys.executable, '-m', 'pytest', '-m', 'not ollama'], timeout=60).returncode)"

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          enable-cache: false
      - name: Install locked audit environment
        run: uv sync --locked --group audit --python 3.14
      - name: Audit installed dependency versions
        run: uv run --no-sync pip-audit --local --skip-editable --progress-spinner off

  package:
    name: Distribution (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          enable-cache: false
      - name: Install locked build and test dependencies
        run: uv sync --locked --group dev --python 3.14
      - name: Build wheel and source distribution
        run: uv build --out-dir dist
      - name: Verify wheel imports and isolated sdist tests (60 seconds per subprocess)
        run: uv run --no-sync python scripts/verify_distributions.py --dist-dir dist

  web:
    name: Private web client
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.1"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          enable-cache: false
      - name: Install locked Python protocol dependencies
        run: uv sync --locked --python 3.14
      - name: Install locked frontend dependencies
        run: npm --prefix web ci
      - name: Check generated API contract
        run: |
          uv run --no-sync python scripts/export_openapi.py --check
          npm --prefix web run generate:api
          git diff --exit-code -- web/openapi.json web/src/api.generated.ts
      - name: Browser behavior unit tests (hard limit of 60 seconds)
        run: npm --prefix web test
      - name: Check frontend source formatting
        run: npm --prefix web run format:check
      - name: Typecheck and build static shell
        run: npm --prefix web run build
      - name: Audit frontend dependencies
        run: npm --prefix web audit --audit-level=moderate

  android:
    name: Android source and private debug build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.1"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          enable-cache: false
      - name: Restore locked tools for tests
        run: |
          uv sync --locked --group dev --python 3.14
          npm --prefix web ci --ignore-scripts
      - name: Native frontend tests (60 seconds) and build
        run: |
          npm --prefix mobile test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix mobile run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download fixed official JDK, Gradle and SDK CLI to ephemeral runner
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP 'yijing-android-tools'
          New-Item -ItemType Directory -Path $toolRoot -Force | Out-Null
          $archives = @(
            @('https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12.1%2B1/OpenJDK21U-jdk_x64_windows_hotspot_21.0.12.1_1.zip', 'jdk.zip', 'f9d6e191ab098c0d416e7d588a24420a8621cd2f4720dab2459b8b7b2d2d8b4e'),
            @('https://services.gradle.org/distributions/gradle-8.14.3-bin.zip', 'gradle.zip', 'bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531'),
            @('https://dl.google.com/android/repository/commandlinetools-win-15859902_latest.zip', 'sdk-cli.zip', '90ae805d20434428bffcb699c290860f19bb5f66a67e6b330067e3de801fb04a')
          )
          foreach ($archive in $archives) {
            $destination = Join-Path $toolRoot $archive[1]
            Invoke-WebRequest -Uri $archive[0] -OutFile $destination -TimeoutSec 180
            if ((Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant() -ne $archive[2]) { throw 'Official archive checksum mismatch' }
            Expand-Archive -LiteralPath $destination -DestinationPath $toolRoot
          }
          $sdkRoot = Join-Path $toolRoot 'android-sdk'
          New-Item -ItemType Directory -Path (Join-Path $sdkRoot 'cmdline-tools') -Force | Out-Null
          Move-Item -LiteralPath (Join-Path $toolRoot 'cmdline-tools') -Destination (Join-Path $sdkRoot 'cmdline-tools/22.0')
          # 复用 hosted runner 已接受的 SDK 许可证；不改 runner 原 SDK 和全局环境。
          Copy-Item -LiteralPath (Join-Path $env:ANDROID_HOME 'licenses') -Destination $sdkRoot -Recurse
          ./scripts/android-env.ps1 -Mode sdk -JdkHome (Join-Path $toolRoot 'jdk-21.0.12.1+1') -SdkRoot $sdkRoot -TimeoutSeconds 600 -ToolArguments @('platforms;android-36', 'build-tools;36.0.0')
          if ($LASTEXITCODE -ne 0) { throw 'Runner SDK setup failed' }
      - name: Java core and host tests (combined hard limit 60 seconds)
        shell: pwsh
        run: |
          $jdk = Join-Path $env:RUNNER_TEMP 'yijing-android-tools/jdk-21.0.12.1+1'
          uv run --no-sync python scripts/run-android-unit-tests.py --jdk-home $jdk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Strictly verified debug compile and lint (no artifact upload)
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP 'yijing-android-tools'
          ./scripts/android-env.ps1 -Mode gradle -JdkHome (Join-Path $toolRoot 'jdk-21.0.12.1+1') -GradleHome (Join-Path $toolRoot 'gradle-8.14.3') -SdkRoot (Join-Path $toolRoot 'android-sdk') -GradleUserHome (Join-Path $toolRoot 'gradle-cache') -TimeoutSeconds 1200 -ToolArguments @('-p', 'mobile/android', ':app:assembleDebug', ':app:lintDebug')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-sync python scripts/verify-android-apk.py --apk mobile/android/app/build/outputs/apk/debug/app-debug.apk --aapt2 (Join-Path $toolRoot 'android-sdk/build-tools/36.0.0/aapt2.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  required:
    name: Required checks
    needs: [test, dependencies, package, web, android]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every test and audit job to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
          AUDIT_RESULT: ${{ needs.dependencies.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          WEB_RESULT: ${{ needs.web.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: test "$TEST_RESULT" = success && test "$AUDIT_RESULT" = success && test "$PACKAGE_RESULT" = success && test "$WEB_RESULT" = success && test "$ANDROID_RESULT" = success
