# 桌面源码门禁；完整许可再分发审查完成前不构建或上传安装包。
name: Desktop Windows

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.98.0-x86_64-pc-windows-msvc
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  windows:
    name: Windows x64 source validation
    runs-on: windows-2022
    timeout-minutes: 55
    outputs:
      committed_lock: ${{ steps.lock.outputs.present }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check for a committed Cargo lockfile
        id: lock
        run: |
          git ls-files --error-unmatch -- desktop/src-tauri/Cargo.lock 2>$null
          $present = $LASTEXITCODE -eq 0
          "present=$($present.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $global:LASTEXITCODE = 0

      - name: Select the fixed Rust MSVC toolchain on this disposable runner
        timeout-minutes: 5
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = rustc --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^rustc 1\.98\.0 ') { throw 'Unexpected Rust toolchain' }
          Write-Output $version
          cargo --version

      - name: Bootstrap only - generate a lockfile for review
        if: steps.lock.outputs.present != 'true'
        timeout-minutes: 5
        run: cargo generate-lockfile --manifest-path desktop/src-tauri/Cargo.toml

      - name: Bootstrap only - prepare the allowlisted rustfmt patch
        if: steps.lock.outputs.present != 'true'
        timeout-minutes: 2
        run: |
          $formatFiles = @(
            'desktop/src-tauri/build.rs',
            'desktop/src-tauri/src/main.rs',
            'desktop/src-tauri/src/bridge.rs',
            'desktop/src-tauri/src/bridge/tests.rs'
          )
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changedFiles = @(git -c core.quotePath=false diff --name-only -- desktop/src-tauri)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@($changedFiles | Where-Object { $_ -notin $formatFiles }).Count -ne 0) {
            throw 'rustfmt changed a source outside the explicit review allowlist'
          }
          $reviewDirectory = Join-Path $env:RUNNER_TEMP 'yijing-desktop-lock-review'
          if (Test-Path -LiteralPath $reviewDirectory) { throw 'Review staging directory already exists' }
          [void](New-Item -ItemType Directory -Path $reviewDirectory)
          $patchPath = Join-Path $reviewDirectory 'rustfmt.patch'
          git -c core.quotePath=false diff --no-ext-diff --no-textconv --no-renames "--output=$patchPath" -- $formatFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $utf8 = [System.Text.UTF8Encoding]::new($false, $true)
          $patchText = $utf8.GetString([System.IO.File]::ReadAllBytes($patchPath))
          [System.IO.File]::WriteAllText($patchPath, $patchText, $utf8)
          Copy-Item -LiteralPath desktop/src-tauri/Cargo.lock -Destination (Join-Path $reviewDirectory 'Cargo.lock')

      - name: Upload only the proposed lockfile and allowlisted formatting patch
        if: steps.lock.outputs.present != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-cargo-lock-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/yijing-desktop-lock-review/Cargo.lock
            ${{ runner.temp }}/yijing-desktop-lock-review/rustfmt.patch
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.lock.outputs.present == 'true'
        with:
          node-version: "24.18.1"

      - name: Install locked frontend and desktop dependencies
        if: steps.lock.outputs.present == 'true'
        run: |
          npm --prefix web ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix desktop ci --ignore-scripts

      - name: Frontend behavior tests and build
        if: steps.lock.outputs.present == 'true'
        run: |
          npm --prefix web test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix web run build

      - name: Desktop configuration, original icons and static tests
        if: steps.lock.outputs.present == 'true'
        run: |
          npm --prefix desktop run prepare:icons
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node desktop/scripts/verify-config.mjs --require-dist --require-lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix desktop test

      - name: Audit npm dependencies
        if: steps.lock.outputs.present == 'true'
        run: |
          npm --prefix web audit --audit-level=moderate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix desktop audit --audit-level=moderate

      - name: Install the fixed Rust audit tool in a private temporary root
        if: steps.lock.outputs.present == 'true'
        timeout-minutes: 15
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP 'yijing-rust-audit-tools'
          if (Test-Path -LiteralPath $toolRoot) { throw 'Audit tool root already exists' }
          cargo install cargo-audit --version 0.22.2 --locked --no-default-features --root $toolRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $auditExecutable = Join-Path $toolRoot 'bin/cargo-audit.exe'
          $auditVersion = & $auditExecutable --version
          if ($LASTEXITCODE -ne 0 -or $auditVersion -notmatch '^cargo-audit 0\.22\.2$') {
            throw 'Unexpected cargo-audit version'
          }
          Write-Output $auditVersion

      - name: Audit the explicit committed Cargo lockfile without exceptions
        if: steps.lock.outputs.present == 'true'
        timeout-minutes: 5
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP 'yijing-rust-audit-tools'
          $auditExecutable = Join-Path $toolRoot 'bin/cargo-audit.exe'
          $lockfile = Join-Path $env:GITHUB_WORKSPACE 'desktop/src-tauri/Cargo.lock'
          if (-not (Test-Path -LiteralPath $lockfile -PathType Leaf)) { throw 'Committed Cargo.lock is missing' }
          # 不允许隐式项目/用户配置降低漏洞门禁；需要例外时必须另行审查工作流。
          $cargoDirectory = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          foreach ($configuration in @(
            (Join-Path $env:GITHUB_WORKSPACE '.cargo/audit.toml'),
            (Join-Path $cargoDirectory 'audit.toml')
          )) {
            if (Test-Path -LiteralPath $configuration) { throw 'Implicit cargo-audit configuration is not allowed' }
          }
          $database = Join-Path $env:RUNNER_TEMP 'yijing-rustsec-advisory-db'
          if (Test-Path -LiteralPath $database) { throw 'Audit database must start from a fresh temporary directory' }
          & $auditExecutable audit --file $lockfile --deny warnings --db $database --url https://github.com/RustSec/advisory-db.git

      - name: Verify Rust formatting
        if: steps.lock.outputs.present == 'true'
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --all -- --check

      - name: Check locked Rust dependencies and precompile tests
        if: steps.lock.outputs.present == 'true'
        timeout-minutes: 20
        run: |
          cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --no-run --manifest-path desktop/src-tauri/Cargo.toml

      - name: Rust tests - hard limit 60 seconds after compilation
        if: steps.lock.outputs.present == 'true'
        run: pwsh -NoProfile -File desktop/scripts/run-rust-tests.ps1

      - name: Lockfiles must remain unchanged
        if: steps.lock.outputs.present == 'true'
        run: git diff --exit-code -- desktop/src-tauri/Cargo.lock desktop/package-lock.json web/package-lock.json

  required:
    name: Desktop required checks
    if: ${{ always() }}
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: A bootstrap artifact cannot satisfy the release gate
        env:
          BUILD_RESULT: ${{ needs.windows.result }}
          COMMITTED_LOCK: ${{ needs.windows.outputs.committed_lock }}
        run: |
          test "$BUILD_RESULT" = success
          test "$COMMITTED_LOCK" = true
