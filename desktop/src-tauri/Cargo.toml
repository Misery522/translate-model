[package]
name = "yijing-desktop"
version = "0.4.0-alpha.1"
description = "译境文字宠物的最小权限 Windows 宿主"
edition = "2021"
license = "Apache-2.0"
publish = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "=2.3.2"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
url = "=2.5.8"
uuid = { version = "=1.26.0", features = ["serde"] }
zeroize = "=1.9.0"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
