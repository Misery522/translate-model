[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "yijing-translate"
version = "0.3.0a1"
description = "A local-only controlled translation agent with Ollama and Gradio"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Misery522 and contributors"}]
dependencies = [
  "gradio==6.26.0",
  "langchain==1.4.0",
  "langchain-ollama==1.1.0",
  "langgraph==1.2.11",
  "langsmith>=0.12.2,<0.13",
  "pydantic>=2.12,<3",
  "platformdirs>=4.3,<5",
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
]

[project.scripts]
yijing = "agent:main"
yijing-smoke = "smoke_model:main"
yijing-api = "yijing_api.cli:main"

[project.urls]
Repository = "https://github.com/Misery522/translate-model"
Issues = "https://github.com/Misery522/translate-model/issues"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.12,<1"]
audit = ["pip-audit>=2.9,<3"]

[tool.setuptools]
py-modules = ["agent", "smoke_model"]

[tool.setuptools.packages.find]
include = ["yijing", "yijing_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "ollama: requires the local Ollama service and qwen3.5:4b model",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
